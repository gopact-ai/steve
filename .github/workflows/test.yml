name: test
on:
  push:
    branches: [master]
  pull_request:
  merge_group:
jobs:
  # `go test -race` split by measured package time (scripts/ci/go-weights.txt).
  # Packages without a weight land on the lightest shard; `test` checks that
  # the shards together ran every package of `go list` exactly once.
  go-shard:
    name: go shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6]
    env:
      SHARDS: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Plan shard
        run: |
          scripts/ci/shard.py go-plan "$SHARDS" "${{ matrix.shard }}" > "$RUNNER_TEMP/packages.txt"
          cp "$RUNNER_TEMP/packages.txt" "$RUNNER_TEMP/go-shard-${{ matrix.shard }}.txt"
          cat "$RUNNER_TEMP/packages.txt"
      - name: go test -race
        run: xargs go test -race -timeout 30m < "$RUNNER_TEMP/packages.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: go-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/go-shard-${{ matrix.shard }}.txt
          retention-days: 3
  go-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
      - run: go vet ./cmd/... ./internal/... ./e2e/...
      - name: Raft local patch regressions
        run: ./scripts/test-raft.sh -race -run '^(TestRaft_AppendEntriesSnapshotBoundary|TestCommitment_|TestNetworkTransport_AppendEntriesScaledTimeout|TestRaft_AppendEntriesScaledTimeout)' -count=1
  test:
    needs: [go-shard, go-checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Go shards and checks passed
        run: |
          test "${{ needs.go-checks.result }}" = success
          test "${{ needs.go-shard.result }}" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: go-shard-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true
      - name: Shards cover every package exactly once
        run: |
          go list ./cmd/... ./internal/... ./e2e/... > "$RUNNER_TEMP/all.txt"
          scripts/ci/shard.py verify "$RUNNER_TEMP/all.txt" "$RUNNER_TEMP"/shards/go-shard-*.txt
  # `make test-console` split by measured command time
  # (scripts/ci/console-weights.txt). Each shard runs the gate's setup lines,
  # including the console build, then its share of the test commands;
  # `console` checks that the shards together ran every command once.
  console-shard:
    name: console shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    env:
      SHARDS: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - name: Toolchain versions for the caches
        id: versions
        run: |
          echo "node=$(node --version)" >> "$GITHUB_OUTPUT"
          echo "playwright=$(node -p "require('./web/console/package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      # node_modules exactly as `npm ci` leaves it for this lockfile and Node.
      - name: Restore web/console/node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: web/console/node_modules
          key: console-modules-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.versions.outputs.node }}-${{ hashFiles('web/console/package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: web/console
      - name: Restore Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.playwright }}
      # A fresh runner lacks Chromium's system packages every time, so they are
      # installed on every run; only their downloads are cached. apt fetches
      # just what the image's package versions no longer match.
      - name: Restore Playwright system package downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/playwright-debs
          key: playwright-debs-${{ steps.versions.outputs.image }}-${{ steps.versions.outputs.playwright }}
          restore-keys: playwright-debs-
      - name: Install Playwright Chromium with its system packages
        run: |
          debs="$RUNNER_TEMP/playwright-debs"
          mkdir -p "$debs/partial"
          printf 'Dir::Cache::Archives "%s/";\nAPT::Keep-Downloaded-Packages "true";\n' "$debs" | sudo tee /etc/apt/apt.conf.d/90playwright-debs
          npx playwright install --with-deps chromium
          sudo rm -f "$debs/lock"
          sudo chmod -R a+rX "$debs"
          ls "$debs"/*.deb 2>/dev/null | wc -l
        working-directory: web/console
      - name: Plan shard
        run: |
          node scripts/ci/console-shards.mjs plan "$SHARDS" "${{ matrix.shard }}" > "$RUNNER_TEMP/console-shard-${{ matrix.shard }}.txt"
          cat "$RUNNER_TEMP/console-shard-${{ matrix.shard }}.txt"
      - name: make test-console (this shard)
        run: node scripts/ci/console-shards.mjs run "$RUNNER_TEMP/console-shard-${{ matrix.shard }}.txt"
      - name: Verify embedded console matches source
        run: test -z "$(git status --porcelain -- internal/readmodel/web/dist)"
      - uses: actions/upload-artifact@v4
        with:
          name: console-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/console-shard-${{ matrix.shard }}.txt
          retention-days: 3
  console:
    needs: [console-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Console shards passed
        run: test "${{ needs.console-shard.result }}" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: console-shard-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true
      - name: Shards cover every console test exactly once
        run: |
          node scripts/ci/console-shards.mjs all > "$RUNNER_TEMP/all.txt"
          node scripts/ci/console-shards.mjs verify "$RUNNER_TEMP/all.txt" "$RUNNER_TEMP"/shards/console-shard-*.txt
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test-desktop
      - name: Package app icon
        run: bash scripts/build-app-icon.sh desktop/macos/Assets/AppIcon.png "$RUNNER_TEMP/AppIcon.icns"
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Agent process groups
        run: go test -race -count=1 ./internal/procgroup/
      - name: Installed peer discovery and stable stop capability
        run: go test -race -count=1 ./internal/nodebootstrap/ ./internal/peerstop/
      - name: MCP broker socket fixtures under default Darwin TMPDIR
        run: go test -race -count=1 -run '^(TestARefusedLaunch|TestLaunchingAReleased|TestAStoppedBroker|TestMCPBindingKeepsSecrets|TestExternalBrokerHolds|TestWorkspaceChangeApplies|TestBroker)' ./internal/node/
      - name: Agent process group stops
        run: go test -race -count=1 -run '^(TestKillProcessGroupReapsDescendants|TestHostConfirmsStopOnlyAfterTheAgentsGroupIsGone|TestHostDoesNotConfirmAStopWhileAHiddenMemberRuns|TestHostRestartsWhileAnExitedAgentsGroupCannotBeEnded|TestHostCloseKillsAnAgentWhoseExitCannotBeWatched|TestLocalTransportDoesNotPassOnAnInheritedMark|TestHostStopWaitsOnlyBrieflyForAnExitedAgentsGroup|TestHostEndsAnExitedAgentsGroupWhileAMemberHoldsItsOutput|TestHostEndsAnAgentWhoseProcessGroupCannotBeIdentified|TestLocalProcessReapsAnAgentWhoseExitCannotBeWatchedOnlyBetweenKills|TestLocalProcessTellsTheExitCodeOfAnAgentWhoseExitCannotBeWatched)$' ./internal/acphost/
      - name: Owned ACP terminals and recovery
        run: TMPDIR=/tmp go test -race -count=1 -run '^(TestTerminal|TestHostTerminal|TestStandaloneTerminal|TestWarmRuntime)' ./internal/acphost/ ./internal/node/
  fleet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Disposable hub gates and cleanup
        run: STEVE_HUBLAB_E2E=1 TMPDIR=/tmp go test -race -count=1 -timeout 12m ./e2e/fleetlab/...
      - name: Disposable fleet acceptance
        run: make e2e-fleet

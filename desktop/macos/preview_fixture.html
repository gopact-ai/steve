<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Isolated preview fixture</title>
<style>body { color: rgb(1, 2, 3); } iframe { width: 100%; height: 400px; }</style>
<div id="root">Workspace</div>
<iframe id="preview" title="HTML preview" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
<script>
const preview = document.getElementById("preview");
window.addEventListener("message", (event) => {
    if (event.source === preview.contentWindow) window.previewResult = event.data;
});
preview.srcdoc = `<!doctype html><html><head><style>
body { color: rgb(20, 40, 60); padding: 24px; }
</style></head><body><h1>Preview report</h1>
<script>
let parentBlocked = false, storageBlocked = false, nativeMessageSent = false;
try { parent.document.getElementById("root").textContent = "escaped"; } catch { parentBlocked = true; }
try { sessionStorage.getItem("steve.token"); } catch { storageBlocked = true; }
try {
    window.webkit.messageHandlers.steve.postMessage({ action: "pickDirectory", id: "untrusted-preview", directory: "" });
    nativeMessageSent = true;
} catch {}
parent.postMessage({
    text: document.querySelector("h1").textContent,
    styled: getComputedStyle(document.body).color === "rgb(20, 40, 60)",
    parentBlocked, storageBlocked, nativeMessageSent, bridgeAbsent: typeof window.steveDesktop === "undefined",
}, "*");
<\/script></body></html>`;
</script>
</html>
